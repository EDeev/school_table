name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libdbus-1-3
      - run: pip install ruff==0.14.0 -r requirements.txt
      - name: Ruff (синтаксис и ошибки)
        run: ruff check --select E9,F main.py
      - name: Окно открывается и читает базу
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          from PyQt5.QtWidgets import QApplication, QMessageBox
          QMessageBox.about = staticmethod(lambda *a: sys.exit('ошибка: ' + a[2]))
          import main
          app = QApplication(sys.argv)
          w = main.MyWidget()
          assert w.Mon_school.rowCount() == 8
          print('ok')"
