name: Release

on:
  push:
    tags: ["v*"]

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - name: Сборка .exe
        run: pyinstaller --onefile --windowed --icon image.ico --name SchoolTable main.py
      - name: Архив с программой, пустой базой и иконкой
        run: Compress-Archive -Path dist/SchoolTable.exe, table.db, image.ico -DestinationPath SchoolTable-windows.zip
      - name: Файл в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" SchoolTable-windows.zip --clobber
